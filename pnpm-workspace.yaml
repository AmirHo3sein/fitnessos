packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

# Transitive dependencies pinned above a published advisory.
#
# Declared HERE as well as in package.json's `pnpm.overrides`, and that duplication is
# deliberate: pnpm 9 reads the package.json field, pnpm 10 reads this file and warns that the
# other is ignored. Keeping one would mean the overrides silently stop applying the day the
# toolchain moves — and the failure mode is a vulnerability quietly returning with no signal,
# which is precisely what an override exists to prevent.
#
# Each entry is here because nothing reachable by upgrading a DIRECT dependency fixes it:
#   postcss, sharp   transitive through next
#   js-yaml          transitive through openapi-typescript → @redocly/openapi-core
#   vite, esbuild    transitive through vitest
#
# Remove an entry once the parent ships a version that no longer needs it. `pnpm audit` in CI
# is what will notice if one becomes wrong rather than merely redundant.
overrides:
  postcss: '>=8.5.23'
  sharp: '>=0.35.0'
  js-yaml: '>=4.3.1'
  vite: '>=6.4.3'
  esbuild: '>=0.25.0'
