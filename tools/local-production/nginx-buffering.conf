events {}

http {
    # A second proxy, configured as hostile to SSE as this machine could make it — and it did NOT
    # break the stream. That negative result is the reason this file is kept.
    #
    # ## What was being checked
    #
    # BACKEND-CONTRACT §5.2 asks for two things — `flush_interval -1` (nginx's `proxy_buffering off`)
    # in the proxy, AND `X-Accel-Buffering: no` from the backend — and calls them protection against
    # different mistakes. The Caddyfile's `:18081` claimed to demonstrate what happens without them.
    # It demonstrated nothing: Caddy sets `FlushInterval = -1` by itself the moment it sees
    # `Content-Type: text/event-stream`, so the "unbuffered" port streamed as well as the buffered
    # one. A demonstration that cannot fail is not evidence, and it was standing in a readiness
    # report as though it were.
    #
    # ## Four attempts, four flushes
    #
    # Time to the first body byte of `GET /api/v1/events`, same stream every time:
    #
    #   Caddy :18080, `flush_interval -1`                                    13ms
    #   Caddy :18081, no directive at all                                    33ms
    #   nginx here, `proxy_buffering on`, `proxy_hide_header X-Accel-…`      32ms
    #   nginx here, upstream genuinely never sent the header (via :18083)    32ms
    #   ...and the same again with `Content-Type` rewritten to `text/plain`  38ms
    #
    # The third line is its own trap: `proxy_hide_header` hides the header from the CLIENT while
    # nginx still acts on it, so it simulates nothing. That is why the location below goes through
    # Caddy :18083, which deletes the header a hop earlier. The stream still flushed. The last line
    # rules out a content-type special case as the explanation.
    #
    # ## What this means, stated carefully
    #
    # It does NOT mean §5.2 is wrong. Response buffering is real, it is what the header exists for,
    # and the deployments that hit it hit it — typically with compression in the path, or an
    # intermediary neither of these is. It means the hazard could not be REPRODUCED on this machine
    # with these two proxies, so no local gate can claim to have verified it. `docs/v2/…` records it
    # as not locally verifiable rather than as passing.
    #
    # What the port below DOES verify, and it is worth something: the stream survives a second proxy
    # hop, from a proxy that was asked to buffer, with the backend's header absent. Both defences
    # cost nothing and both stay.

    proxy_http_version 1.1;

    server {
        listen 18082;

        # The hostile path: buffering on, small buffers, and an upstream that never sent
        # `X-Accel-Buffering` — :18083 is the API with the header deleted (see the Caddyfile).
        location /api/v1/events {
            proxy_pass http://host.docker.internal:18083/api/v1/events;
            proxy_buffering on;

            # Small, so a buffer would fill in seconds rather than needing megabytes of events to
            # fill a default 8k×8 pool.
            proxy_buffer_size 4k;
            proxy_buffers 4 4k;
            proxy_busy_buffers_size 8k;

            proxy_read_timeout 1h;
        }

        # The control: same nginx, same request, backend header left alone.
        location /control/events {
            proxy_pass http://host.docker.internal:8791/api/v1/events;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 4 4k;
            proxy_read_timeout 1h;
        }

        location / {
            proxy_pass http://host.docker.internal:8791;
        }
    }
}
