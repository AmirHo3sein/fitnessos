name: scheduled

# Stages 12 and onward from the handbook's CI table. The PR workflow runs the critical tier on
# every change; this runs everything, on a cadence that does not sit in anyone's feedback loop.
on:
  schedule:
    # 03:00 UTC daily. Not on every push: the full suite is four times the critical tier and
    # growing, and a 2% tier that takes twenty minutes stops being run.
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    # The SAME image the committed `-linux` baselines were generated in, pinned to the Playwright
    # version in the lockfile. This is what makes visual regression meaningful in CI rather than a
    # source of unexplainable diffs: `ubuntu-latest` and this container do not have the same fonts,
    # and a screenshot is a picture of fonts. Bump this tag and the Playwright dependency together,
    # then regenerate the baselines — `docs/ci-baselines.md` has the command.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host --user pwuser
    env:
      STUB_API_URL: http://127.0.0.1:8791
      INTERNAL_API_URL: http://127.0.0.1:8791/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # No `playwright install` step: the container already carries the browsers for exactly this
      # Playwright version, which is half the reason for using it.

      - name: build
        run: pnpm --filter @fitnessos/web build

      # Stage 12 — every spec, both projects. Includes the accessibility scans that do not gate
      # a PR: a contrast regression on a page a change did not touch should be caught the same
      # day rather than blocking someone who did not cause it.
      #
      # Also includes `visual.spec.ts`, whose baselines are PER PLATFORM: Playwright suffixes them
      # with `process.platform`, so a `-darwin` image committed from a laptop is not the file this
      # job looks for.
      #
      # ## A correction — the previous version of this comment was wrong in a way that mattered
      #
      # It said the first run on a new platform "writes its own and reports them as missing rather
      # than failing". It does write them, and it FAILS. Verified twice: empirically, by deleting a
      # baseline and running with CI=1 (the run reports "A snapshot doesn't exist … writing actual"
      # and exits non-zero), and in the pinned Playwright 1.62.1 source, where `handleMissing`
      # returns `softError` together with `shouldNotRetryTest: true` — so `retries: 1` cannot mask
      # it either, deliberately, because a retry would grade the baseline the first attempt just
      # wrote and manufacture a false pass.
      #
      # So this job needs `-linux` baselines to exist. They are committed, generated in the SAME
      # image this job runs in — see `container:` above and `docs/ci-baselines.md`. Generating them
      # anywhere else would trade a red build for a diff nobody can explain, because font
      # rasterisation differs between environments.
      - name: e2e:full
        run: pnpm --filter @fitnessos/web e2e:full

      # `always()`, and the snapshot directory alongside the report.
      #
      # The previous version uploaded only `playwright-report` on `failure()`, while the comment
      # above told the reader to recover baselines from the artefact. Playwright writes baselines to
      # the snapshot directory, not into the report — the report holds content-hash-named copies —
      # so the recovery path it described could not have worked.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/e2e/**-snapshots/**
          retention-days: 7
          if-no-files-found: warn

  # The kill switch, thrown. A flag that has never been turned off is a branch nobody has visited —
  # and the one time it matters, nobody wants to discover that the switch does nothing.
  #
  # Its own job because it needs the app running with a DIFFERENT environment: a flag is a property
  # of the deployment, so the only honest way to test it off is to start a deployment with it off.
  # The specs are skipped in every other run, by a guard on the same variable.
  kill-switch:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host --user pwuser
    env:
      STUB_API_URL: http://127.0.0.1:8791
      INTERNAL_API_URL: http://127.0.0.1:8791/api/v1
      FLAG_LIVE_INVALIDATION: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm --filter @fitnessos/web build

      # `FLAG_LIVE_INVALIDATION` is set at job level, so Playwright's own `webServer` starts the app
      # with the flag off — no hand-rolled server lifecycle needed here, unlike the lighthouse job.
      - name: the switch is off and the app still works
        run: pnpm --filter @fitnessos/web exec playwright test --grep "kill switch"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kill-switch-report
          path: apps/web/playwright-report
          retention-days: 7

  # Stage 15 — Lighthouse, on the routes reachable without a session. Separate job so nine page
  # loads do not sit in the e2e job's critical path.
  #
  # It does NOT download a browser, contrary to what this comment said before: lhci finds Chrome
  # through `chrome-launcher`'s PATH probing, and `ubuntu-latest` preinstalls google-chrome-stable.
  # That is a dependency on the runner image which nothing here enforced, so it is now explicit —
  # the step below fails loudly if Chrome is absent rather than surfacing as an opaque
  # chrome-launcher error in the one job nobody watches.
  #
  # Scheduled rather than per-PR because a performance SCORE varies by several points between
  # two runs of identical code — a gate that fails for reasons nobody caused is a gate that gets
  # disabled. The score assertions are loose and the metric ones are tight; the config explains
  # which and why.
  lighthouse:
    runs-on: ubuntu-latest
    env:
      STUB_API_URL: http://127.0.0.1:8791
      INTERNAL_API_URL: http://127.0.0.1:8791/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm --filter @fitnessos/web build

      # Chrome comes from the runner image. Asserted rather than assumed — see the job comment.
      - name: chrome is present
        run: google-chrome --version

      # Started AND waited for in ONE step, with the logs printed inline on failure.
      #
      # Three findings from the first real run of this job, all of them mine:
      #
      # 1. The stub never became reachable — `wait-on` timed out after 60 s on
      #    `/api/v1/athletes/me`, and lighthouse was skipped.
      # 2. The diagnostic step meant to explain that FAILED: `tail -50 a b` is rejected as "option
      #    used in invalid context" when given more than one file in this shell. The one step whose
      #    whole job was to explain a failure was itself broken, which is the worst thing for a
      #    diagnostic to be. It is `tail -n 50` now.
      # 3. Splitting start from wait across two steps made "does a background process survive a step
      #    boundary" a variable inside an already-unexplained failure. One step removes the question:
      #    the servers and the thing waiting for them share a shell.
      #
      # `-v` on wait-on so the log says which URL it is still waiting for, and the failure branch
      # prints both server logs plus what is actually listening — because the next failure should be
      # explicable from the log alone. It was: see below.
      #
      # ## `tcp:` for the stub, and why the obvious URL was wrong
      #
      # The verbose log answered it immediately, and contradicted the guess in the previous commit
      # ("the stub did not come up"). The stub was up the whole time, answering **501** — because
      # `wait-on`'s `http://` scheme issues a **HEAD** request, and the stub implements GET only.
      # Confirmed locally: `GET /api/v1/athletes/me` → 401, `HEAD` → 501.
      #
      # `http-get://` would fix the method and not the problem: `wait-on` treats any non-2xx as
      # not-ready, and this endpoint answers 401 without a session — deliberately, since that is what
      # makes it a readiness signal at all. Playwright's `webServer` accepts that 401 and is happy
      # with the same URL, which is exactly why this looked like a safe thing to copy.
      #
      # So the stub is waited on at the TCP level, which is what "the server is up" actually means
      # here, and carries no opinion about status codes. The app keeps its HTTP check because `/`
      # genuinely answers 200.
      - name: start the stub and the app, and wait for both
        run: |
          nohup pnpm --filter @fitnessos/stub-api start > /tmp/stub.log 2>&1 &
          nohup pnpm --filter @fitnessos/web start > /tmp/app.log 2>&1 &
          pnpm exec wait-on -v \
            tcp:127.0.0.1:8791 \
            http://127.0.0.1:3000 \
            --timeout 90000 || {
              echo "=== stub.log ==="; tail -n 100 /tmp/stub.log || true
              echo "=== app.log ===";  tail -n 100 /tmp/app.log  || true
              echo "=== listening ==="; { ss -ltnp || netstat -ltn; } 2>&1 | head -20 || true
              exit 1
            }

      # Warm every audited route before measuring, and this is not a way of flattering the numbers.
      #
      # The first real run showed `/` — the first URL in the list — at TBT 1256 ms and a performance
      # score of 66, while `/en` and `/sign-in` came in at 142 ms / 96 and 176 ms / 94. The pages are
      # near-identical; what `/` was paying for was everything that happens once: Next's first
      # compile of a `force-dynamic` route, the first `getTranslations` load, an empty module cache.
      #
      # A threshold set from that number would encode the warm-up rather than the page, and the
      # penalty would silently move to whichever route happened to be listed first.
      - name: warm the routes
        run: |
          for url in http://127.0.0.1:3000/ http://127.0.0.1:3000/en http://127.0.0.1:3000/sign-in; do
            curl -fsS -o /dev/null "$url" && curl -fsS -o /dev/null "$url"
          done

      - name: lighthouse
        run: pnpm lighthouse

      # `-n 50`, not `-50`: with more than one file the short form is rejected in this shell, which
      # is how the first run's only diagnostic managed to fail.
      - name: server logs
        if: failure()
        run: tail -n 50 /tmp/stub.log /tmp/app.log || true

      # `include-hidden-files`, because `.lighthouseci` is a dot-directory and upload-artifact
      # excludes hidden paths by default — the artifact would have been silently empty, and this is
      # the only way the reports leave the runner (uploading them to a public bucket was refused on
      # privacy grounds; see the note in lighthouserc.cjs).
      #
      # `if-no-files-found: error`, so an empty artifact is a red step rather than a warning nobody
      # reads.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
