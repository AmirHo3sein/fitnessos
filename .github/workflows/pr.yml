name: pr

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Stage 1
      - name: install
        run: pnpm install --frozen-lockfile

      # Stage 2 — ADR-0026 contract drift.
      # Running against the committed stopgap spec today; the only change when
      # @fitnessos/api-spec is published is where the spec is read from.
      - name: contract drift
        run: pnpm --filter @fitnessos/contracts contracts:check

      # Stage 3
      - name: typecheck
        run: pnpm typecheck

      # Stage 4 — eslint plus dependency-cruiser boundary rules
      - name: lint
        run: pnpm lint

      # Stage 5 — includes the generator tests (stage 11), which assert that
      # generated output renders cleanly and honours the boundary conventions.
      - name: test:unit
        run: pnpm test:unit

      # Stage 6 — infra against a mocked network (MSW). Catches the mapper being
      # wrong about the shape the backend actually sends, which a unit test built
      # from the same assumption cannot.
      - name: test:integration
        run: pnpm test:integration

      # Stage 7 — components in jsdom. Drag, snap and hit-testing are deliberately
      # NOT here: jsdom has no layout engine, so a geometry test would assert on
      # zeros. Those live in stage 10 or as pure unit tests of the maths.
      - name: test:component
        run: pnpm test:component

      # Stage 8
      - name: build
        run: pnpm build
        env:
          INTERNAL_API_URL: http://127.0.0.1:8000/api/v1

      # Stage 9 — reads the manifests stage 8 produced, so no second build.
      - name: bundle budget
        run: node tools/bundle-budget.mjs

      # Stage 11b — a generated context must typecheck and lint with zero hand
      # edits. Rendering cleanly proves nothing about types, so this generates
      # into the live workspace, verifies it, and removes it again.
      - name: generated context is buildable
        run: |
          pnpm gen:context ci-probe complex
          pnpm install --no-frozen-lockfile
          pnpm --filter @fitnessos/ctx-ci-probe typecheck
          pnpm --filter @fitnessos/ctx-ci-probe lint
          pnpm lint:boundaries
          rm -rf packages/ctx-ci-probe
          pnpm install --no-frozen-lockfile

  # Stage 10 — separate job so a browser download does not sit in the critical path
  # of the checks above. Only @critical runs per PR; the full suite is scheduled.
  # A 2% tier that takes twenty minutes stops being run, and a test nobody runs is
  # worse than no test because it still reads as coverage.
  e2e:
    runs-on: ubuntu-latest
    env:
      # The stub API (tools/stub-api) stands in for the backend, which lives in another
      # repository (ADR-0026). It is a separate process, never part of the app build.
      #
      # STUB_API_URL does two things: it enables the `/api/v1` rewrite in next.config,
      # which stands in for the production reverse proxy (ADR-0025) so browser-side
      # requests resolve; and it tells Playwright where to start and reach the stub.
      # INTERNAL_API_URL is the server-side path the RSC prefetch uses. Both point at
      # the same process, so the whole request path is exercised rather than half of it.
      STUB_API_URL: http://127.0.0.1:8791
      INTERNAL_API_URL: http://127.0.0.1:8791/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 22 minimum for `--experimental-strip-types`, which is how the stub runs its
          # TypeScript with no build step and no transform dependency.
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: install browsers
        run: pnpm --filter @fitnessos/web exec playwright install --with-deps chromium

      - name: build
        run: pnpm --filter @fitnessos/web build

      # Playwright's webServer config starts both the stub and the app, so there is no
      # separate step here — and no sleep-and-hope, since it waits on a real readiness
      # URL for each.
      - name: e2e:critical
        run: pnpm --filter @fitnessos/web e2e:critical

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
